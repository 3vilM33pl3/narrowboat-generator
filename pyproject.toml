[project]
name = "narrowboat-generator"
version = "1.0.0"
description = "Procedural Blender generator for NB57 'Wren', an original 57 ft narrowboat"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy", "Pillow"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
